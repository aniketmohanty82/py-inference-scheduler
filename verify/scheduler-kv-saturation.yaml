profile_handler:
  type: single_profile
profiles:
  backpressure:
    flow_control:
      type: kv_saturation
      default_osl: 1024
    scorers:
      - type: waiting_queue
        weight: 5.0
      - type: least_queue
        weight: 2.0
      - type: kv_cache
        weight: 1.0
      - type: prefix_cache
        weight: 1.0
    picker:
      type: max_score
