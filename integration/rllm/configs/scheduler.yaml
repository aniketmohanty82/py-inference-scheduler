# Scheduler profile for the gateway RoutingPolicy (arms B and C) - the full
# tau3 champion profile: the vendored gateway patch threads the parsed
# request body into body-aware policies, so prefix_cache hashes the growing
# messages list, and the saturation filter is cherry-picked onto this branch.
profile_handler:
  type: single_profile
profiles:
  rllm_gateway:
    filters:
      - type: saturation
        kv_threshold: 0.95
        waiting_threshold: 16
    scorers:
      - type: prefix_cache
        weight: 4.0
        max_prefix_blocks: 2048
        lru_capacity_per_server: 262144
      - type: waiting_queue
        weight: 1.0
      - type: kv_cache
        weight: 0.5
      - type: sticky_session
        weight: 4.0
        header_name: x-rls-session-id
    picker:
      type: max_score
