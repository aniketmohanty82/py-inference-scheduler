# 32B VANILLA smoke (arm-A preview): byte-identical to
# rayjob-32b-policy-smoke minus the routing_policy override - the gateway
# falls back to stock StickyLeastLoadedPolicy. Gives the matched A-vs-B
# single-step throughput comparison (perf/throughput, time_per_step,
# rollout wall) at the same model/TP/replica config.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: rllm-32b-vanilla-smoke
spec:
  shutdownAfterJobFinishes: false
  # Task subset + registry are baked into the image at RLLM_HOME=/opt/rllm-home
  # (cluster-wide identical paths); no runtime prep step.
  entrypoint: >-
    bash -lc "
    set -euo pipefail;
    cd /opt/py-inference-scheduler;
    MODEL_PATH=Qwen/Qwen3-32B
    bash integration/rllm/smoke/train_smoke.sh
    ++actor_rollout_ref.rollout.engine_kwargs.vllm.enable_auto_tool_choice=true
    ++actor_rollout_ref.rollout.engine_kwargs.vllm.tool_call_parser=hermes
    rllm.rollout.train.max_tokens=4096
    rllm.rollout.val.max_tokens=4096
    actor_rollout_ref.rollout.tensor_model_parallel_size=2
    data.max_prompt_length=16384
    trainer.experiment_name=32b-vanilla-smoke
    "
  rayClusterSpec:
    rayVersion: "2.56.0"
    headGroupSpec:
      rayStartParams:
        num-cpus: "0"
        num-gpus: "0"
        dashboard-host: "0.0.0.0"
      template:
        spec:
          serviceAccountName: rllm-sandbox-runner
          containers:
          - name: ray-head
            image: us-south1-docker.pkg.dev/aniket-gke-dev/llm-images/rllm-verl-mooncake:dev
            imagePullPolicy: Always
            ports:
            - containerPort: 6379
              name: gcs
            - containerPort: 8265
              name: dashboard
            env:
            - name: RLS_SANDBOX_BACKEND
              value: "kubernetes"
            - name: ROUTER_CONFIG_PATH
              value: "/opt/py-inference-scheduler/integration/rllm/configs/scheduler.yaml"
            # integration/ is repo-root code, not part of the installed
            # py_inference_scheduler package - the gateway subprocess imports
            # the policy by dotted path and needs the repo on sys.path.
            - name: PYTHONPATH
              value: "/opt/py-inference-scheduler"
            - name: RLS_DECISION_LOG
              value: "1"
            - name: RLLM_GATEWAY_NO_LOOPBACK_PIN
              value: "1"
            - name: RLLM_K8S_NAMESPACE
              value: "default"
            - name: RLLM_K8S_NODE_SELECTOR
              value: "cloud.google.com/gke-nodepool=default-pool"
            - name: PYTHONHASHSEED
              value: "0"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
            resources:
              # r2egym builder materializes the full 4,578-row HF dataset in
              # memory (~7GB) before subsetting.
              requests:
                cpu: "3"
                memory: 16Gi
              limits:
                cpu: "3"
                memory: 16Gi
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-tmp
          volumes:
          - name: ray-tmp
            emptyDir: {}
    workerGroupSpecs:
    - replicas: 1
      minReplicas: 1
      maxReplicas: 1
      groupName: gpu-group
      rayStartParams:
        num-gpus: "8"
      template:
        spec:
          serviceAccountName: rllm-sandbox-runner
          nodeSelector:
            cloud.google.com/gke-networking-dra-driver: "true"
          tolerations:
          - key: cloud.google.com/gke-queued
            operator: Exists
            effect: NoSchedule
          - key: cloud.google.com/gke-spot
            operator: Exists
            effect: NoSchedule
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          containers:
          - name: ray-worker
            image: us-south1-docker.pkg.dev/aniket-gke-dev/llm-images/rllm-verl-mooncake:dev
            imagePullPolicy: Always
            securityContext:
              capabilities:
                add: ["IPC_LOCK"]
            env:
            - name: RLS_SANDBOX_BACKEND
              value: "kubernetes"
            - name: ROUTER_CONFIG_PATH
              value: "/opt/py-inference-scheduler/integration/rllm/configs/scheduler.yaml"
            # integration/ is repo-root code, not part of the installed
            # py_inference_scheduler package - the gateway subprocess imports
            # the policy by dotted path and needs the repo on sys.path.
            - name: PYTHONPATH
              value: "/opt/py-inference-scheduler"
            - name: RLS_DECISION_LOG
              value: "1"
            - name: RLLM_GATEWAY_NO_LOOPBACK_PIN
              value: "1"
            - name: RLLM_K8S_NAMESPACE
              value: "default"
            - name: RLLM_K8S_NODE_SELECTOR
              value: "cloud.google.com/gke-nodepool=default-pool"
            - name: PYTHONHASHSEED
              value: "0"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
            resources:
              requests:
                cpu: "100"
                memory: 800Gi
                nvidia.com/gpu: "8"
              limits:
                cpu: "100"
                memory: 800Gi
                nvidia.com/gpu: "8"
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-tmp
            - mountPath: /dev/shm
              name: dshm
          volumes:
          - name: ray-tmp
            emptyDir: {}
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 128Gi
