# pb2 STORE arm: 2-node cross-node RDMA pullbench. Same preemption-heavy
# regime as the single-node pullbench (TP=2, gmu 0.30, 16k contexts) at
# double the workload: 64 tasks x n=2 = 128 rollouts across 2 replicas,
# ONE replica per H200 node, so Mooncake's 4 mounted segments (2 per node)
# split saves ~half-remote by master allocation - the cross-node arm.
#
# Placement is forced at the k8s level, NOT trusted to Ray: verl's PGs are
# STRICT_PACK per PG with no spread across PGs, so on 8-GPU pods both
# replicas pack onto one node (observed 2026-08-31). Instead:
#   - trainer pod: exactly 4 GPUs - the only ray node that fits the 4-GPU
#     trainer PG, which fully_async_main allocates (blocking) BEFORE any
#     rollout PG, so it can never be squatted on by a rollout replica.
#   - 2x rollout pods: exactly 2 GPUs each + hostname anti-affinity - each
#     fits exactly one TP=2 replica, on different physical nodes.
#
# Measure DURING the run (counters die with the engines): metrics-scraper
# sidecars ride every pod (gateway placement is actor-dependent); the one
# that finds the gateway at 127.0.0.1:9090 captures both replicas' series.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: rllm-32b-pb2-store
spec:
  shutdownAfterJobFinishes: false
  # Task subset + registry are baked into the image at RLLM_HOME=/opt/rllm-home
  # (cluster-wide identical paths); no runtime prep step.
  entrypoint: >-
    bash -lc "
    set -euo pipefail;
    cd /opt/py-inference-scheduler;
    MODEL_PATH=Qwen/Qwen3-32B
    bash integration/rllm/smoke/train_smoke.sh
    ++actor_rollout_ref.rollout.engine_kwargs.vllm.enable_auto_tool_choice=true
    ++actor_rollout_ref.rollout.engine_kwargs.vllm.tool_call_parser=hermes
    ++actor_rollout_ref.rollout.engine_kwargs.vllm.disable_log_stats=false
    ++actor_rollout_ref.rollout.engine_kwargs.vllm.kv_transfer_config='{kv_connector: DecodeKVSavingConnector, kv_connector_module_path: py_inference_scheduler.datalayer.connectors.mooncake.decode_save, kv_role: kv_both, kv_connector_extra_config: {save_decode_kv: true}}'
    ++actor_rollout_ref.rollout.engine_kwargs.vllm.prefix_caching_hash_algo=sha256_cbor
    rllm.rollout.train.max_tokens=null
    rllm.rollout.val.max_tokens=null
    actor_rollout_ref.rollout.tensor_model_parallel_size=2
    data.max_prompt_length=16384
    +rllm.gateway.routing_policy=integration.rllm.policy.SchedulerRoutingPolicy
    actor_rollout_ref.rollout.gpu_memory_utilization=0.30
    actor_rollout_ref.rollout.n=2
    data.train_batch_size=64
    data.val_batch_size=64
    actor_rollout_ref.actor.ppo_mini_batch_size=64
    rllm.workflow.n_parallel_tasks=128
    rllm.trainer.total_batches=1
    rllm.async_training.enable=true
    rllm.workflow.raise_on_error=false
    actor_rollout_ref.hybrid_engine=False
    trainer.n_gpus_per_node=4
    rollout.nnodes=2
    rollout.n_gpus_per_node=2
    trainer.experiment_name=32b-pb2-store
    "
  rayClusterSpec:
    rayVersion: "2.56.0"
    headGroupSpec:
      rayStartParams:
        num-cpus: "0"
        num-gpus: "0"
        dashboard-host: "0.0.0.0"
      template:
        spec:
          serviceAccountName: rllm-sandbox-runner
          containers:
          - name: ray-head
            image: us-south1-docker.pkg.dev/aniket-gke-dev/llm-images/rllm-verl-mooncake:dev
            imagePullPolicy: Always
            ports:
            - containerPort: 6379
              name: gcs
            - containerPort: 8265
              name: dashboard
            env:
            - name: RLS_SANDBOX_BACKEND
              value: "kubernetes"
            - name: RLS_SANDBOX_CONCURRENCY
              value: "128"
            - name: ROUTER_CONFIG_PATH
              value: "/opt/py-inference-scheduler/integration/rllm/configs/scheduler.yaml"
            # integration/ is repo-root code, not part of the installed
            # py_inference_scheduler package - the gateway subprocess imports
            # the policy by dotted path and needs the repo on sys.path.
            - name: PYTHONPATH
              value: "/opt/py-inference-scheduler"
            - name: RLS_DECISION_LOG
              value: "1"
            - name: RLLM_GATEWAY_NO_LOOPBACK_PIN
              value: "1"
            - name: RLLM_K8S_NAMESPACE
              value: "default"
            - name: RLLM_K8S_NODE_SELECTOR
              value: "cloud.google.com/gke-nodepool=default-pool"
            - name: RLLM_K8S_CPU_REQUEST
              value: "50m"
            - name: RLLM_K8S_MEMORY_REQUEST_MB
              value: "256"
            - name: RLLM_K8S_POD_TIMEOUT
              value: "1500"
            - name: RLLM_MSWEA_STEP_LIMIT
              value: "25"
            - name: PYTHONHASHSEED
              value: "0"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
            resources:
              # r2egym builder materializes the full 4,578-row HF dataset in
              # memory (~7GB) before subsetting.
              requests:
                cpu: "3"
                memory: 16Gi
              limits:
                cpu: "3"
                memory: 16Gi
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-tmp
          - name: metrics-scraper
            image: python:3.11-slim
            command: ["python", "-u", "-c"]
            args:
              - |
                import json, time, urllib.request
                def get(url, timeout=4):
                    with urllib.request.urlopen(url, timeout=timeout) as r:
                        return r.read().decode()
                while True:
                    try:
                        workers = json.loads(get("http://127.0.0.1:9090/admin/workers"))
                        print("TS", int(time.time()), "workers:", len(workers), flush=True)
                        for w in workers:
                            try:
                                text = get(w["url"] + "/metrics")
                            except Exception as e:
                                print("ERR", w["url"], e, flush=True)
                                continue
                            for line in text.splitlines():
                                if line.startswith("#"):
                                    continue
                                if ("prefix_cache" in line or "num_preemptions" in line
                                        or "kv_cache_usage" in line
                                        or "prompt_tokens" in line
                                        or "generation_tokens" in line):
                                    print("URL", w["url"], line, flush=True)
                    except Exception as e:
                        print("NOGATEWAY", e, flush=True)
                    time.sleep(30)
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
          volumes:
          - name: ray-tmp
            emptyDir: {}
    workerGroupSpecs:
    # One TP=2 replica per pod; anti-affinity forces the two pods onto
    # different physical nodes so segment traffic must cross the fabric.
    - replicas: 2
      minReplicas: 2
      maxReplicas: 2
      groupName: rollout-group
      rayStartParams:
        num-gpus: "2"
      template:
        spec:
          serviceAccountName: rllm-sandbox-runner
          nodeSelector:
            cloud.google.com/gke-networking-dra-driver: "true"
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                  - key: ray.io/group
                    operator: In
                    values: ["rollout-group"]
                topologyKey: kubernetes.io/hostname
          tolerations:
          - key: cloud.google.com/gke-queued
            operator: Exists
            effect: NoSchedule
          - key: cloud.google.com/gke-spot
            operator: Exists
            effect: NoSchedule
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          containers:
          - name: ray-worker
            image: us-south1-docker.pkg.dev/aniket-gke-dev/llm-images/rllm-verl-mooncake:dev
            imagePullPolicy: Always
            securityContext:
              capabilities:
                add: ["IPC_LOCK"]
            env:
            - name: RLS_SANDBOX_BACKEND
              value: "kubernetes"
            - name: RLS_SANDBOX_CONCURRENCY
              value: "128"
            - name: ROUTER_CONFIG_PATH
              value: "/opt/py-inference-scheduler/integration/rllm/configs/scheduler.yaml"
            # integration/ is repo-root code, not part of the installed
            # py_inference_scheduler package - the gateway subprocess imports
            # the policy by dotted path and needs the repo on sys.path.
            - name: PYTHONPATH
              value: "/opt/py-inference-scheduler"
            - name: RLS_DECISION_LOG
              value: "1"
            - name: RLLM_GATEWAY_NO_LOOPBACK_PIN
              value: "1"
            - name: RLLM_K8S_NAMESPACE
              value: "default"
            - name: RLLM_K8S_NODE_SELECTOR
              value: "cloud.google.com/gke-nodepool=default-pool"
            - name: RLLM_K8S_CPU_REQUEST
              value: "50m"
            - name: RLLM_K8S_MEMORY_REQUEST_MB
              value: "256"
            - name: RLLM_K8S_POD_TIMEOUT
              value: "1500"
            - name: RLLM_MSWEA_STEP_LIMIT
              value: "25"
            - name: PYTHONHASHSEED
              value: "0"
            # Weight-sync NCCL must ride the pod network on every rank:
            # rollout pods expose RoCE NICs (DRANET) but the trainer pod has
            # none, and mixed IB/socket transport selection hangs the
            # rendezvous. Mooncake is unaffected (own ibverbs engine).
            - name: NCCL_IB_DISABLE
              value: "1"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
            - name: MOONCAKE_CONFIG_PATH
              value: "/etc/mooncake/mooncake_config.json"
            - name: MC_FORCE_HCA
              value: "1"
            - name: WITH_NVIDIA_PEERMEM
              value: "0"
            resources:
              requests:
                cpu: "40"
                memory: 450Gi
                nvidia.com/gpu: "2"
              limits:
                cpu: "40"
                memory: 450Gi
                nvidia.com/gpu: "2"
              claims:
              - name: rdma
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-tmp
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /etc/mooncake
              name: mooncake-vol
          # In-pod scraper: engines and gateway die with the job, so counters
          # must be captured live; sidecar stdout is retrievable via
          # `kubectl logs <pod> -c metrics-scraper` even after the run.
          - name: metrics-scraper
            image: python:3.11-slim
            command: ["python", "-u", "-c"]
            args:
              - |
                import json, time, urllib.request
                def get(url, timeout=4):
                    with urllib.request.urlopen(url, timeout=timeout) as r:
                        return r.read().decode()
                while True:
                    try:
                        workers = json.loads(get("http://127.0.0.1:9090/admin/workers"))
                        print("TS", int(time.time()), "workers:", len(workers), flush=True)
                        for w in workers:
                            try:
                                text = get(w["url"] + "/metrics")
                            except Exception as e:
                                print("ERR", w["url"], e, flush=True)
                                continue
                            for line in text.splitlines():
                                if line.startswith("#"):
                                    continue
                                if ("prefix_cache" in line or "num_preemptions" in line
                                        or "kv_cache_usage" in line
                                        or "prompt_tokens" in line
                                        or "generation_tokens" in line):
                                    print("URL", w["url"], line, flush=True)
                    except Exception as e:
                        print("NOGATEWAY", e, flush=True)
                    time.sleep(30)
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
          resourceClaims:
          - name: rdma
            resourceClaimTemplateName: mooncake-rdma-8
          volumes:
          - name: ray-tmp
            emptyDir: {}
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi
          - name: mooncake-vol
            configMap:
              name: mooncake-config
    # Trainer pod: exactly 4 GPUs so the trainer PG has exactly one home.
    # No RDMA claim / mooncake env - the FSDP actors never touch the store.
    - replicas: 1
      minReplicas: 1
      maxReplicas: 1
      groupName: trainer-group
      rayStartParams:
        num-gpus: "4"
      template:
        spec:
          serviceAccountName: rllm-sandbox-runner
          nodeSelector:
            cloud.google.com/gke-networking-dra-driver: "true"
          tolerations:
          - key: cloud.google.com/gke-queued
            operator: Exists
            effect: NoSchedule
          - key: cloud.google.com/gke-spot
            operator: Exists
            effect: NoSchedule
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          containers:
          - name: ray-worker
            image: us-south1-docker.pkg.dev/aniket-gke-dev/llm-images/rllm-verl-mooncake:dev
            imagePullPolicy: Always
            env:
            - name: RLS_SANDBOX_BACKEND
              value: "kubernetes"
            - name: RLS_SANDBOX_CONCURRENCY
              value: "128"
            - name: ROUTER_CONFIG_PATH
              value: "/opt/py-inference-scheduler/integration/rllm/configs/scheduler.yaml"
            - name: PYTHONPATH
              value: "/opt/py-inference-scheduler"
            - name: RLS_DECISION_LOG
              value: "1"
            - name: RLLM_GATEWAY_NO_LOOPBACK_PIN
              value: "1"
            - name: RLLM_K8S_NAMESPACE
              value: "default"
            - name: RLLM_K8S_NODE_SELECTOR
              value: "cloud.google.com/gke-nodepool=default-pool"
            - name: RLLM_K8S_CPU_REQUEST
              value: "50m"
            - name: RLLM_K8S_MEMORY_REQUEST_MB
              value: "256"
            - name: RLLM_K8S_POD_TIMEOUT
              value: "1500"
            - name: RLLM_MSWEA_STEP_LIMIT
              value: "25"
            - name: PYTHONHASHSEED
              value: "0"
            # Weight-sync NCCL must ride the pod network on every rank:
            # rollout pods expose RoCE NICs (DRANET) but the trainer pod has
            # none, and mixed IB/socket transport selection hangs the
            # rendezvous. Mooncake is unaffected (own ibverbs engine).
            - name: NCCL_IB_DISABLE
              value: "1"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
            resources:
              requests:
                cpu: "40"
                memory: 400Gi
                nvidia.com/gpu: "4"
              limits:
                cpu: "40"
                memory: 400Gi
                nvidia.com/gpu: "4"
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-tmp
            - mountPath: /dev/shm
              name: dshm
          - name: metrics-scraper
            image: python:3.11-slim
            command: ["python", "-u", "-c"]
            args:
              - |
                import json, time, urllib.request
                def get(url, timeout=4):
                    with urllib.request.urlopen(url, timeout=timeout) as r:
                        return r.read().decode()
                while True:
                    try:
                        workers = json.loads(get("http://127.0.0.1:9090/admin/workers"))
                        print("TS", int(time.time()), "workers:", len(workers), flush=True)
                        for w in workers:
                            try:
                                text = get(w["url"] + "/metrics")
                            except Exception as e:
                                print("ERR", w["url"], e, flush=True)
                                continue
                            for line in text.splitlines():
                                if line.startswith("#"):
                                    continue
                                if ("prefix_cache" in line or "num_preemptions" in line
                                        or "kv_cache_usage" in line
                                        or "prompt_tokens" in line
                                        or "generation_tokens" in line):
                                    print("URL", w["url"], line, flush=True)
                    except Exception as e:
                        print("NOGATEWAY", e, flush=True)
                    time.sleep(30)
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
          volumes:
          - name: ray-tmp
            emptyDir: {}
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi
