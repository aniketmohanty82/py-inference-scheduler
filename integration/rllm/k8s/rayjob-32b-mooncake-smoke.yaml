# 32B MOONCAKE smoke (arm-C preview, Gate-6c-lite): the policy smoke plus
# the full overscheduling stack on the 4 verl-launched replicas -
# DecodeKVSavingConnector + OverschedulingScheduler via engine_kwargs
# (first NESTED-DICT passthrough test), offload-all on turn end, Mooncake
# store over the node's RDMA NICs (same-node rides the HCA).
#
# Smoke-only tuning: preserve_prefix_blocks=32 (~512-token shared-template
# guard), min_kv_usage=0.0 (always offload - maximal exercise). Arm-C runs
# must re-measure preserve_prefix for the final prompt template.
#
# Prereqs beyond the policy smoke: mooncake-master + mooncake-config
# ConfigMap + mooncake-rdma-8 ResourceClaimTemplate (k8s/base/).
# Observables: connector + OverschedulingScheduler init on all 4 replicas,
# "overschedule: evicted N blocks" lines, mooncake master puts>0, gets on
# next-turn pulls, plus everything the policy smoke shows.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: rllm-32b-mooncake-smoke
spec:
  shutdownAfterJobFinishes: false
  # Task subset + registry are baked into the image at RLLM_HOME=/opt/rllm-home
  # (cluster-wide identical paths); no runtime prep step.
  entrypoint: >-
    bash -lc "
    set -euo pipefail;
    cd /opt/py-inference-scheduler;
    MODEL_PATH=Qwen/Qwen3-32B
    bash integration/rllm/smoke/train_smoke.sh
    ++actor_rollout_ref.rollout.engine_kwargs.vllm.enable_auto_tool_choice=true
    ++actor_rollout_ref.rollout.engine_kwargs.vllm.tool_call_parser=hermes
    ++actor_rollout_ref.rollout.engine_kwargs.vllm.kv_transfer_config='{kv_connector: DecodeKVSavingConnector, kv_connector_module_path: py_inference_scheduler.datalayer.connectors.mooncake.decode_save, kv_role: kv_both, kv_connector_extra_config: {save_decode_kv: true, preserve_prefix_blocks: 32, min_kv_usage: 0.0, offload_all: true}}'
    ++actor_rollout_ref.rollout.engine_kwargs.vllm.scheduler_cls=py_inference_scheduler.datalayer.connectors.mooncake.overschedule.OverschedulingScheduler
    ++actor_rollout_ref.rollout.engine_kwargs.vllm.prefix_caching_hash_algo=sha256_cbor
    actor_rollout_ref.rollout.gpu_memory_utilization=0.65
    rllm.async_training.enable=true
    rllm.workflow.raise_on_error=false
    actor_rollout_ref.hybrid_engine=False
    trainer.n_gpus_per_node=4
    rollout.nnodes=1
    rollout.n_gpus_per_node=4
    rllm.rollout.train.max_tokens=4096
    rllm.rollout.val.max_tokens=4096
    actor_rollout_ref.rollout.tensor_model_parallel_size=2
    data.max_prompt_length=16384
    +rllm.gateway.routing_policy=integration.rllm.policy.SchedulerRoutingPolicy
    trainer.experiment_name=32b-mooncake-smoke
    "
  rayClusterSpec:
    rayVersion: "2.56.0"
    headGroupSpec:
      rayStartParams:
        num-cpus: "0"
        num-gpus: "0"
        dashboard-host: "0.0.0.0"
      template:
        spec:
          serviceAccountName: rllm-sandbox-runner
          containers:
          - name: ray-head
            image: us-south1-docker.pkg.dev/aniket-gke-dev/llm-images/rllm-verl-mooncake:dev
            imagePullPolicy: Always
            ports:
            - containerPort: 6379
              name: gcs
            - containerPort: 8265
              name: dashboard
            env:
            - name: RLS_SANDBOX_BACKEND
              value: "kubernetes"
            - name: ROUTER_CONFIG_PATH
              value: "/opt/py-inference-scheduler/integration/rllm/configs/scheduler.yaml"
            # integration/ is repo-root code, not part of the installed
            # py_inference_scheduler package - the gateway subprocess imports
            # the policy by dotted path and needs the repo on sys.path.
            - name: PYTHONPATH
              value: "/opt/py-inference-scheduler"
            - name: RLS_DECISION_LOG
              value: "1"
            - name: RLLM_GATEWAY_NO_LOOPBACK_PIN
              value: "1"
            - name: RLLM_K8S_NAMESPACE
              value: "default"
            - name: RLLM_K8S_NODE_SELECTOR
              value: "cloud.google.com/gke-nodepool=default-pool"
            - name: PYTHONHASHSEED
              value: "0"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
            resources:
              # r2egym builder materializes the full 4,578-row HF dataset in
              # memory (~7GB) before subsetting.
              requests:
                cpu: "3"
                memory: 16Gi
              limits:
                cpu: "3"
                memory: 16Gi
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-tmp
          volumes:
          - name: ray-tmp
            emptyDir: {}
    workerGroupSpecs:
    - replicas: 1
      minReplicas: 1
      maxReplicas: 1
      groupName: gpu-group
      rayStartParams:
        num-gpus: "8"
      template:
        spec:
          serviceAccountName: rllm-sandbox-runner
          nodeSelector:
            cloud.google.com/gke-networking-dra-driver: "true"
          tolerations:
          - key: cloud.google.com/gke-queued
            operator: Exists
            effect: NoSchedule
          - key: cloud.google.com/gke-spot
            operator: Exists
            effect: NoSchedule
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          containers:
          - name: ray-worker
            image: us-south1-docker.pkg.dev/aniket-gke-dev/llm-images/rllm-verl-mooncake:dev
            imagePullPolicy: Always
            securityContext:
              capabilities:
                add: ["IPC_LOCK"]
            env:
            - name: RLS_SANDBOX_BACKEND
              value: "kubernetes"
            - name: ROUTER_CONFIG_PATH
              value: "/opt/py-inference-scheduler/integration/rllm/configs/scheduler.yaml"
            # integration/ is repo-root code, not part of the installed
            # py_inference_scheduler package - the gateway subprocess imports
            # the policy by dotted path and needs the repo on sys.path.
            - name: PYTHONPATH
              value: "/opt/py-inference-scheduler"
            - name: RLS_DECISION_LOG
              value: "1"
            - name: RLLM_GATEWAY_NO_LOOPBACK_PIN
              value: "1"
            - name: RLLM_K8S_NAMESPACE
              value: "default"
            - name: RLLM_K8S_NODE_SELECTOR
              value: "cloud.google.com/gke-nodepool=default-pool"
            - name: PYTHONHASHSEED
              value: "0"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_api_token
            - name: MOONCAKE_CONFIG_PATH
              value: "/etc/mooncake/mooncake_config.json"
            - name: MC_FORCE_HCA
              value: "1"
            - name: WITH_NVIDIA_PEERMEM
              value: "0"
            - name: MOONCAKE_OVERSCHEDULING_OFFLOAD_ALL
              value: "1"
            resources:
              requests:
                cpu: "100"
                memory: 800Gi
                nvidia.com/gpu: "8"
              limits:
                cpu: "100"
                memory: 800Gi
                nvidia.com/gpu: "8"
              claims:
              - name: rdma
            volumeMounts:
            - mountPath: /tmp/ray
              name: ray-tmp
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /etc/mooncake
              name: mooncake-vol
          resourceClaims:
          - name: rdma
            resourceClaimTemplateName: mooncake-rdma-8
          volumes:
          - name: ray-tmp
            emptyDir: {}
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 128Gi
          - name: mooncake-vol
            configMap:
              name: mooncake-config
