# Baseline arm. ROUTER_CONFIG_PATH must live in the runtime env (not the
# submitting shell) so it reaches the AgentLoopWorker actors that build the
# Scheduler. PYTHONPATH puts the shipped working_dir ahead of any copy baked
# into the image.
working_dir: "."
excludes:
  - ".venv"
  - ".git"
  - "benchmark-results"
  - "**/__pycache__"
pip:
  - "kubernetes"
env_vars:
  # The runtime env IS the arm: ray job submit does not forward the submitting
  # shell's environment. Only ARM and STEPS live here -- the workload itself
  # comes from run_swe.sh unmodified.
  ARM: "fcoff"
  # 2 steps: the GPU pool is spot, so keep each arm's preemption window short.
  STEPS: "2"
  PYTHONPATH: ".:src"
  PROMETHEUS_MULTIPROC_DIR: "/tmp/metrics"
  # No ROUTER_CONFIG_PATH: the baseline installs no hook, so nothing reads it.
  SWE_SANDBOX_NAMESPACE: "agents-system"
  SWE_CMD_TIMEOUT_S: "60"
  SWE_OBS_MAX_CHARS: "6000"
  SWE_SANDBOX_CPU_REQUEST: "200m"
  SWE_SANDBOX_MEM_REQUEST: "768Mi"
