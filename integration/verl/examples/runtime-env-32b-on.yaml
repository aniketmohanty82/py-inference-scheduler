# Reasoning-scale treatment: Qwen3-32B with the gate at kv 0.90 / waiting 4
# (the threshold-sweep winner). Identical to runtime-env-32b-off.yaml except
# ROUTER_CONFIG_PATH and the flow-control watcher tick -- the gate is the
# only difference between arms.
env_vars:
  ARM: "fcon"
  STEPS: "1"
  GMU: "0.35"
  GROUP_N: "4"
  TURNS: "25"
  PYTHONPATH: "/work:/work/src"
  PROMETHEUS_MULTIPROC_DIR: "/tmp/metrics"
  # Must match runtime-env-32b-off.yaml: raw stdout lines for measurement.
  RAY_DEDUP_LOGS: "0"
  ROUTER_CONFIG_PATH: "/work/configs/flow-control/lq-kv90.yaml"
  SWE_SANDBOX_NAMESPACE: "agents-system"
  SWE_CMD_TIMEOUT_S: "60"
  SWE_OBS_MAX_CHARS: "20000"
  SWE_SANDBOX_CPU_REQUEST: "200m"
  SWE_SANDBOX_MEM_REQUEST: "768Mi"
  FLOW_CONTROL_POLL_S: "0.1"
