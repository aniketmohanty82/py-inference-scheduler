# Deep-pressure baseline: identical to runtime-env-gmu19-off.yaml except GMU
# and STEPS. gmu 0.18 is a ~47k-token pool per engine -- still above one
# max-length (32k) request, so it preempts without the sub-working-set
# deadlock regime -- and 4 steps double the event count for the rate ratio.
working_dir: "."
excludes:
  - ".venv"
  - ".git"
  - "benchmark-results"
  - "**/__pycache__"
  # Sweep artifact dirs live inside /work on the head pod; without this the
  # accumulated run logs push the package over ray's 100MiB upload cap (413).
  - "sweep*"
pip:
  - "kubernetes"
env_vars:
  ARM: "fcoff"
  STEPS: "4"
  GMU: "0.18"
  PYTHONPATH: ".:src"
  PROMETHEUS_MULTIPROC_DIR: "/tmp/metrics"
  # Ray collapses identical stdout lines across actors, silently
  # undercounting every log-based measurement (parks, drops, FLEET).
  RAY_DEDUP_LOGS: "0"
  ROUTER_CONFIG_PATH: "configs/flow-control/lq-off.yaml"
  SWE_SANDBOX_NAMESPACE: "agents-system"
  SWE_CMD_TIMEOUT_S: "60"
  SWE_OBS_MAX_CHARS: "6000"
  SWE_SANDBOX_CPU_REQUEST: "200m"
  SWE_SANDBOX_MEM_REQUEST: "768Mi"
