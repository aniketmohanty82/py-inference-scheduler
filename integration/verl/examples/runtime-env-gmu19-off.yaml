# Pool-shrink pressure baseline: identical to runtime-env-fc-off.yaml (the
# ledger A/B baseline: 64-task dataset, batch 64, least_queue, no gate)
# except GMU. Growing the batch does not grow engine pressure on this
# workload -- the sandbox tier throttles turn arrivals -- so pressure comes
# from shrinking the pool: gmu 0.19 is a ~60k-token pool per engine versus
# ~100k at 0.22, still enough to hold one max-length (32k) request, while
# measured burst demand (32 running x 4-7k contexts) exceeds it by design.
working_dir: "."
excludes:
  - ".venv"
  - ".git"
  - "benchmark-results"
  - "**/__pycache__"
pip:
  - "kubernetes"
env_vars:
  ARM: "fcoff"
  STEPS: "2"
  GMU: "0.19"
  PYTHONPATH: ".:src"
  PROMETHEUS_MULTIPROC_DIR: "/tmp/metrics"
  # Ray collapses identical stdout lines across actors, silently
  # undercounting every log-based measurement (parks, drops, FLEET).
  RAY_DEDUP_LOGS: "0"
  ROUTER_CONFIG_PATH: "configs/flow-control/lq-off.yaml"
  SWE_SANDBOX_NAMESPACE: "agents-system"
  SWE_CMD_TIMEOUT_S: "60"
  SWE_OBS_MAX_CHARS: "6000"
  SWE_SANDBOX_CPU_REQUEST: "200m"
  SWE_SANDBOX_MEM_REQUEST: "768Mi"
