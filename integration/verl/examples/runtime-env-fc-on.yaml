# Treatment arm: identical to runtime-env-fc-off.yaml except ROUTER_CONFIG_PATH
# (and the flow-control watcher tick), so the gate is the only difference.
working_dir: "."
excludes:
  - ".venv"
  - ".git"
  - "benchmark-results"
  - "**/__pycache__"
  # Must match runtime-env-fc-off.yaml.
  - "sweep*"
pip:
  - "kubernetes"
env_vars:
  # Must match runtime-env-fc-off.yaml on every knob except ARM and
  # ROUTER_CONFIG_PATH -- that is the whole invariant of the comparison.
  ARM: "fcon"
  # Must match runtime-env-fc-off.yaml.
  STEPS: "2"
  PYTHONPATH: ".:src"
  PROMETHEUS_MULTIPROC_DIR: "/tmp/metrics"
  # Must match runtime-env-fc-off.yaml: raw stdout lines for measurement.
  RAY_DEDUP_LOGS: "0"
  ROUTER_CONFIG_PATH: "configs/flow-control/lq-kv90.yaml"
  SWE_SANDBOX_NAMESPACE: "agents-system"
  SWE_CMD_TIMEOUT_S: "60"
  SWE_OBS_MAX_CHARS: "6000"
  SWE_SANDBOX_CPU_REQUEST: "200m"
  SWE_SANDBOX_MEM_REQUEST: "768Mi"
  FLOW_CONTROL_POLL_S: "0.1"
