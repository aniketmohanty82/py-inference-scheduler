# DWS queued-provisioning request for TWO H200 nodes (a3-ultragpu-8g) on
# rdma-queue-pool, provisioned together or not at all - the one channel built
# for a stockout: spot (rdma-gpu-pool) creations fail with the zone exhausted,
# on-demand flex-start (rdma-flex-pool) scale-ups fail with "GCE out of
# resources", and a queued request waits in line instead of polling.
#
# When status shows Provisioned=True, both nodes come up fenced to this
# request: give the worker podTemplate
#   annotations:
#     cluster-autoscaler.gke.io/consume-provisioning-request: swe-ab-h200
#     cluster-autoscaler.gke.io/provisioning-class-name: queued-provisioning.gke.io
# and the (recreated) worker pods schedule onto them. Delete the request when
# done - DWS bills the nodes for their whole lease.
apiVersion: v1
kind: PodTemplate
metadata:
  name: swe-ab-h200-shape
  namespace: default
template:
  spec:
    nodeSelector:
      cloud.google.com/gke-nodepool: rdma-queue-pool
    tolerations:
    - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
    - {key: cloud.google.com/gke-queued, operator: Exists, effect: NoSchedule}
    containers:
    - name: shape
      image: registry.k8s.io/pause:3.9
      resources:
        requests: {cpu: "100", memory: 2200Gi, nvidia.com/gpu: "8"}
        limits: {cpu: "100", memory: 2200Gi, nvidia.com/gpu: "8"}
    restartPolicy: Never
---
apiVersion: autoscaling.x-k8s.io/v1
kind: ProvisioningRequest
metadata:
  name: swe-ab-h200
  namespace: default
spec:
  provisioningClassName: queued-provisioning.gke.io
  podSets:
  - count: 2
    podTemplateRef:
      name: swe-ab-h200-shape
