# Grants OUR RayCluster service account the sandbox-manager Role that
# configs/swe_sandbox_rbac.yaml defines.
#
# Upstream's RoleBinding subjects default/default because their Ray pods run
# as the default SA; ours run as rllm-sandbox-runner. Without this the
# agent loop's Sandbox creates are denied and every trajectory ends after
# 2 turns with zero tool calls - silently, since the loop does not surface
# the 403 as a rollout-error.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: swe-sandbox-manager-rayserviceaccount
  namespace: agents-system
subjects:
  - kind: ServiceAccount
    name: rllm-sandbox-runner
    namespace: default
roleRef:
  kind: Role
  name: swe-sandbox-manager
  apiGroup: rbac.authorization.k8s.io
