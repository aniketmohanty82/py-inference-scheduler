# Overrides the shared mooncake-config for the verl SWE A/B cluster.
# Every vLLM TP-rank process mounts its own global segment as pinned host
# memory - verl's 4 engines at tp=2 mean 8 mounts on the 8-GPU worker.
# 512gb x 8 OOMKilled the ray-worker container (2026-09-08T10:01Z, exit 137);
# 256gb x 8 = 2TiB tripped Ray's 95% memory monitor (10:35Z, 22 workers
# killed, 8 x ~262GB VLLM::Worker_TP RSS recorded in the kill report).
# 128gb x 8 = 1TiB total store, matching the rllm rig's capacity gate.
apiVersion: v1
data:
  mooncake_config.json: |
    {
      "mode": "embedded",
      "metadata_server": "P2PHANDSHAKE",
      "master_server_address": "mooncake-master.default.svc.cluster.local:50051",
      "protocol": "rdma",
      "device_name": "",
      "global_segment_size": "128gb",
      "local_buffer_size": "4gb"
    }
kind: ConfigMap
metadata:
  name: mooncake-config
