# Overrides the shared mooncake-config for the verl SWE A/B cluster.
#
# Every vLLM TP-rank process mounts its own global segment as pinned host
# memory - verl's 4 engines at tp=2 mean 8 mounts on the 8-GPU worker.
# 128gb x 8 = 1TiB of the node's 2.9TiB, the KV tier this project exists to
# measure. Sizing history, all recorded:
#   512gb x 8 = 4TiB -> ray-worker OOMKilled (exit 137, 2026-09-08T10:01Z)
#   256gb x 8 = 2TiB -> Ray memory monitor killed 22 workers (95% threshold)
#   128gb x 8 = 1TiB -> fits the container's 2200Gi with room for the trainer
#
# Segment size is NOT what caused the GPU nodes to die at engine exit - 32gb
# panicked identically. That was the kernel's soft-lockup policy during RDMA
# deregistration; see k8s/rdma-softlockup-tuning.yaml for the stack trace and
# the fix. Do not shrink this to work around node deaths.
apiVersion: v1
data:
  mooncake_config.json: |
    {
      "mode": "embedded",
      "metadata_server": "P2PHANDSHAKE",
      "master_server_address": "mooncake-master.default.svc.cluster.local:50051",
      "protocol": "rdma",
      "device_name": "",
      "global_segment_size": "128gb",
      "local_buffer_size": "4gb"
    }
kind: ConfigMap
metadata:
  name: mooncake-config
