# Two placeholder pods that keep the cluster autoscaler asking rdma-flex-pool
# (DWS flex-start, a3-ultragpu-8g) for two H200 nodes. The autoscaler only
# requests capacity for pending pods, so without these it never asks; the
# pods are pause containers sized like the swe-ab worker so the node shape
# matches. When nodes arrive, delete this Deployment and schedule the real
# RayCluster worker onto them within the scale-down delay.
#
#   kubectl apply -f integration/verl/k8s/h200-flex-placeholder.yaml
#   kubectl delete deployment h200-flex-placeholder
apiVersion: apps/v1
kind: Deployment
metadata:
  name: h200-flex-placeholder
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels: {app: h200-flex-placeholder}
  template:
    metadata:
      labels: {app: h200-flex-placeholder}
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: rdma-flex-pool
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: cloud.google.com/gke-queued, operator: Exists, effect: NoSchedule}
      - {key: cloud.google.com/gke-spot, operator: Exists, effect: NoSchedule}
      containers:
      - name: hold
        image: registry.k8s.io/pause:3.9
        resources:
          requests: {cpu: "100", memory: 2200Gi, nvidia.com/gpu: "8"}
          limits: {cpu: "100", memory: 2200Gi, nvidia.com/gpu: "8"}
