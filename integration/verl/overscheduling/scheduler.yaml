profile_handler:
  type: single_profile
profiles:
  overscheduling:
    flow_control:
      type: kv_saturation
      # The load runs fixed-length turns, so a first turn's output is known: keep in step with --output-tokens.
      default_osl: 256
      # Engines fill to this cap before the next one opens; it holds each below preemption, allowing
      # for the ledger counting tokens where vLLM allocates whole blocks.
      budget_fraction: 0.94
    scorers:
      # The gate offers only the engine holding a trajectory's prefix while it fits; everything else
      # goes to the fullest engine with room, so engines fill one at a time.
      - type: fill_first
        weight: 1.0
    picker:
      type: max_score
