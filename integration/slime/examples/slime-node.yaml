# A single self-contained slime "node" on Kubernetes — the moral equivalent of the
# slime quickstart's:
#     docker run --gpus all --ipc=host --shm-size=16g -it slimerl/slime:latest /bin/bash
# (https://github.com/THUDM/slime/blob/main/docs/en/get_started/quick_start.md)
#
# There is no `docker run --gpus all` on GKE (GPUs are exposed to Pods, not to a
# docker daemon), so this Pod IS that command:
#     --gpus all              -> resources.limits.nvidia.com/gpu
#     --shm-size / --ipc=host -> emptyDir{medium:Memory} at /dev/shm
#     -it ... /bin/bash       -> command:[sleep infinity] + `kubectl exec -it`
#     (driver injection)      -> the nvidia hostPath mount + LD_LIBRARY_PATH
#
# slime runs its OWN ray inside this pod (the run script does `ray start`), so the
# stock quickstart works verbatim — no KubeRay, no RayCluster, no edits except the
# two router flags below.
#
# Usage:
#   kubectl apply -f integration/slime/examples/slime-node.yaml
#   kubectl exec -it slime-node -- bash
#   # then, inside the pod, follow the quickstart verbatim:
#   hf download Qwen/Qwen3-4B --local-dir /root/Qwen3-4B
#   hf download --repo-type dataset zhuzilin/dapo-math-17k --local-dir /root/dapo-math-17k
#   cd /root/slime && source scripts/models/qwen3-4B.sh
#   PYTHONPATH=/root/Megatron-LM python tools/convert_hf_to_torch_dist.py "${MODEL_ARGS[@]}" \
#       --hf-checkpoint /root/Qwen3-4B --save /root/Qwen3-4B_torch_dist
#
#   # bring up our router in-pod (the only addition to the quickstart), in this same shell:
#   pip install fastapi uvicorn aiohttp prometheus-client pyyaml setproctitle
#   git clone -b slime-integration https://github.com/aniketmohanty82/py-inference-scheduler.git /root/router
#   cd /root/router   # run from the repo root so `python -m integration.slime` resolves
#   python -m integration.slime --host 127.0.0.1 --port 8000 \
#       --config integration/slime/examples/scheduler.yaml > /root/router.log 2>&1 &
#   # (launching from a separate exec / surviving disconnect? prefix `setsid … </dev/null`)
#
#   # stock run script + the ONLY change: point SGLANG_ARGS at our router
#   cd /root/slime
#   sed -i 's#--rollout-num-gpus-per-engine 2#--rollout-num-gpus-per-engine 2\n   --sglang-router-ip 127.0.0.1\n   --sglang-router-port 8000#' scripts/run-qwen3-4B.sh
#   NUM_GPUS=8 bash scripts/run-qwen3-4B.sh
#
# Teardown:  kubectl delete pod slime-node
apiVersion: v1
kind: Pod
metadata:
  name: slime-node
spec:
  restartPolicy: Never
  containers:
  - name: slime
    image: slimerl/slime:v0.3.0
    command: ["sleep", "infinity"]
    env:
    - name: HUGGING_FACE_HUB_TOKEN
      valueFrom:
        secretKeyRef: { name: hf-secret, key: hf_api_token }
    - name: LD_LIBRARY_PATH
      value: /usr/local/nvidia/lib64
    resources:
      limits:
        nvidia.com/gpu: "8"
    volumeMounts:
    - { mountPath: /dev/shm, name: dshm }
    - { mountPath: /usr/local/nvidia, name: nvidia }
  volumes:
  - name: dshm
    emptyDir: { medium: Memory }
  - name: nvidia
    hostPath: { path: /home/kubernetes/bin/nvidia }
