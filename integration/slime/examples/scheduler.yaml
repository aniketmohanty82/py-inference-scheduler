profile_handler:
  type: single_profile
profiles:
  backpressure:
    # Uncomment to queue requests scheduler-side while every worker is
    # saturated (see docs/simple_backpressure.md).
    # flow_control:
    #   type: simple_backpressure
    #   kv_threshold: 0.95
    #   waiting_threshold: 6
    scorers:
      - type: waiting_queue
        weight: 5.0
      - type: least_queue
        weight: 2.0
      - type: kv_cache
        weight: 1.0
      - type: prefix_cache
        weight: 1.0
    picker:
      type: max_score
