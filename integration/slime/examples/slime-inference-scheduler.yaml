# KubeRay RayCluster running slime (v0.3.0) + the py-inference-scheduler router.
#
# The router is a SEPARATE, CPU-only Deployment fronted by a ClusterIP Service.
# The slime RayCluster below is stock (slime image, GPU workers) — no router
# container, no scheduler ConfigMap, no shared metrics volume. The router scrapes
# each engine's /metrics over HTTP and proxies /generate, so it needs none of that
# on the engine pods.
#
# Prereqs (one-time):
#   kubectl create configmap slime-scheduler-config \
#       --from-file=scheduler.yaml=integration/slime/examples/scheduler.yaml
#   (hf-secret with key 'hf_api_token' already exists on this cluster)
#
# After applying, submit the slime job and point it at the router by DNS name:
#   --sglang-router-ip slime-router --sglang-router-port 8000
---
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: slime-inference-scheduler
  namespace: default
spec:
  rayVersion: "2.52.0"
  headGroupSpec:
    rayStartParams:
      num-cpus: "0"
      num-gpus: "0"
      dashboard-host: 0.0.0.0
    template:
      metadata:
        annotations:
          networking.gke.io/default-interface: eth0
      spec:
        containers:
        - name: ray-head
          image: slimerl/slime:v0.3.0
          imagePullPolicy: IfNotPresent
          ports:
          - { containerPort: 6379, name: gcs, protocol: TCP }
          - { containerPort: 8265, name: dashboard, protocol: TCP }
          - { containerPort: 10001, name: client, protocol: TCP }
          resources:
            # default-pool nodes are ~3.9 CPU / ~13.6Gi allocatable; keep requests
            # under that so the head schedules on a CPU node.
            requests: { cpu: "2", memory: 8Gi }
            limits: { cpu: "3", memory: 12Gi }
          volumeMounts:
          - { mountPath: /tmp/ray, name: ray-tmp }
        volumes:
        - { name: ray-tmp, emptyDir: {} }
  workerGroupSpecs:
  - replicas: 1
    minReplicas: 1
    maxReplicas: 1
    groupName: gpu-group
    rayStartParams:
      num-gpus: "8"
    template:
      metadata:
        annotations:
          networking.gke.io/default-interface: eth0
          networking.gke.io/interfaces: |
            [
              {"interfaceName":"eth0","network":"default"},
              {"interfaceName":"eth1","network":"gvnic-1"},
              {"interfaceName":"eth2","network":"rdma-0"},
              {"interfaceName":"eth3","network":"rdma-1"},
              {"interfaceName":"eth4","network":"rdma-2"},
              {"interfaceName":"eth5","network":"rdma-3"},
              {"interfaceName":"eth6","network":"rdma-4"},
              {"interfaceName":"eth7","network":"rdma-5"},
              {"interfaceName":"eth8","network":"rdma-6"},
              {"interfaceName":"eth9","network":"rdma-7"}
            ]
      spec:
        nodeSelector:
          cloud.google.com/gke-nodepool: a3-gpu-pool
        containers:
        - name: ray-worker
          image: slimerl/slime:v0.3.0
          imagePullPolicy: IfNotPresent
          env:
          - name: HUGGING_FACE_HUB_TOKEN
            valueFrom:
              secretKeyRef: { name: hf-secret, key: hf_api_token }
          - name: LD_LIBRARY_PATH
            value: /usr/local/nvidia/lib64
          resources:
            limits: { cpu: "64", memory: 1024Gi, nvidia.com/gpu: "8" }
            requests: { cpu: "64", memory: 1024Gi, nvidia.com/gpu: "8" }
          volumeMounts:
          - { mountPath: /tmp/ray, name: ray-tmp }
          - { mountPath: /dev/shm, name: dshm }
          - { mountPath: /usr/local/nvidia, name: nvidia }
          - { mountPath: /usr/local/gib, name: gib }
        volumes:
        - { name: ray-tmp, emptyDir: {} }
        - { name: dshm, emptyDir: { medium: Memory } }
        - { name: nvidia, hostPath: { path: /home/kubernetes/bin/nvidia } }
        - { name: gib, hostPath: { path: /home/kubernetes/bin/gib } }
---
# Router: standalone CPU process. initContainer clones the fork's slime-integration
# branch; the main container pip-installs deps and runs `python -m integration.slime`.
# For releases, swap this for a baked image and drop the initContainer + pip install.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slime-router
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: { app: slime-router }
  template:
    metadata:
      labels: { app: slime-router }
    spec:
      initContainers:
      - name: clone
        image: alpine/git:latest
        args:
        - clone
        - --depth=1
        - --branch=slime-integration
        - https://github.com/aniketmohanty82/py-inference-scheduler.git
        - /app
        volumeMounts:
        - { mountPath: /app, name: src }
      containers:
      - name: router
        image: python:3.11-slim
        workingDir: /app
        command: ["sh", "-c"]
        args:
        - >
          pip install --no-cache-dir fastapi uvicorn aiohttp prometheus-client pyyaml &&
          python -m integration.slime --host 0.0.0.0 --port 8000
          --config /etc/scheduler/scheduler.yaml
        ports:
        - { containerPort: 8000, name: http }
        resources:
          limits: { cpu: "2", memory: 4Gi }
          requests: { cpu: "1", memory: 1Gi }
        readinessProbe:
          httpGet: { path: /workers, port: 8000 }
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - { mountPath: /app, name: src }
        - { mountPath: /etc/scheduler, name: scheduler-vol }
      volumes:
      - { name: src, emptyDir: {} }
      - name: scheduler-vol
        configMap: { name: slime-scheduler-config }
---
apiVersion: v1
kind: Service
metadata:
  name: slime-router
  namespace: default
spec:
  selector: { app: slime-router }
  ports:
  - { name: http, port: 8000, targetPort: 8000, protocol: TCP }
